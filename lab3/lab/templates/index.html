<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Спикеры</title>
  <link rel="stylesheet" href="/styles/index_style.css" />
</head>
<body>
  <div class="container">
    <!-- Общий фон -->
    <div class="background"></div>

    <!-- Контейнер всех карточек -->
    <div class="cards-container">
      
      <!-- Карточка: Стелла -->
      <div class="card" id="stella-card">
        <div class="card-bg1" id="stella-card-bg1"></div>
        <div class="card-bg2" id="stella-card-bg2"></div>
        <div class="name" id="stella-name">Стелла</div>
        <div class="format" id="stella-format">Формат:  Очно </div>
        <a href="http://localhost:8080/speaker/2" class="button" id="stella-button">
          <div class="button-text">подробнее</div>
        </a>
        <img src="/img/2.png" class="image" id="stella-image" />
      </div>

      <!-- Карточка: Флора -->
      <div class="card" id="flora-card">
        <div class="card-bg1" id="flora-card-bg1"></div>
        <div class="card-bg2" id="flora-card-bg2"></div>
        <div class="name" id="flora-name">Флора</div>
        <div class="format" id="flora-format">Формат: Дистанционно</div>
        <a href="http://localhost:8080/speaker/3" class="button" id="flora-button">
          <div class="button-text">подробнее</div>
        </a>
        <img src="/img/3.png" class="image" id="flora-image" />
      </div>

      <!-- Карточка: Блум -->
      <div class="card" id="bloom-card">
        <div class="card-bg1" id="bloom-card-bg1"></div>
        <div class="card-bg2" id="bloom-card-bg2"></div>
        <div class="name" id="bloom-name">Блум</div>
        <div class="format" id="bloom-format">Формат: Дистанционно</div>
        <a href="http://localhost:8080/speaker/1" class="button" id="bloom-button">
          <div class="button-text">подробнее</div>
        </a>
        <img src="/img/1.png" class="image" id="bloom-image" />
      </div>

      <!-- Карточка: Муза -->
      <div class="card" id="musa-card">
        <div class="card-bg1" id="musa-card-bg1"></div>
        <div class="card-bg2" id="musa-card-bg2"></div>
        <div class="name" id="musa-name">Муза</div>
        <div class="format" id="musa-format">Формат: Очно</div>
        <a href="http://localhost:8080/speaker/5" class="button" id="musa-button">
          <div class="button-text">подробнее</div>
        </a>
        <img src="/img/5.png" class="image" id="musa-image" />
      </div>

      <!-- Карточка: Текна -->
      <div class="card" id="tecna-card">
        <div class="card-bg1" id="tecna-card-bg1"></div>
        <div class="card-bg2" id="tecna-card-bg2"></div>
        <div class="name" id="tecna-name">Текна</div>
        <div class="format" id="tecna-format">Формат: Дистанционно</div>
        <a href="http://localhost:8080/speaker/4" class="button" id="tecna-button">
          <div class="button-text">подробнее</div>
        </a>
        <img src="/img/4.png" class="image" id="tecna-image" />
      </div>

    </div> <!-- Конец cards-container -->

    <!-- Поисковая строка-->
    <div class="header-bg1"></div> 
    <div class="header-bg2"></div>
    <div class="icon-bg">
      <img class="icon-inner" src="/img/glass.png" />
    </div>

    <div class="shape-bg">
      <a href="http://localhost:8080/meetup/1" class="button">
        <img class="shape-inner" src="/img/person.png" />
            {{ if ne .cart_count 0 }}
            <div style= " color:black; font-size:24px; font-family:Montserrat;" class="shape-inner"> {{ .cart_count }} </div>
        {{ end }}
      </a>
    </div>

    <div style="position: absolute; top: 0; left: 0; width: 50px; height: 50px; border-radius: 50%;">
      <a href="http://localhost:8080/speakers" class="button" style="display: block; width: 100%; height: 100%; text-decoration: none; border-radius: 50%;">
        <img src="/img/home.png" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;"/>
      </a>
    </div>

  </div> <!-- Конец контейнера -->
</body>
